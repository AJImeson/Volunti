backend-build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd backend/Volunti
    - dotnet restore
    - dotnet build --no-restore --configuration Release
    - dotnet publish --no-build --configuration Release --output ../publish
  artifacts:
    paths:
      - backend/publish/
    expire_in: 1 hour
