backend-deploy:
  stage: deploy
  image: python:3.10-alpine
  variables:
    STACK_NAME: "$CI_PROJECT_NAMESPACE_SLUG-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG"
  script:
    - pip install requests
    - python deploy.py 
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://${STACK_NAME}.doe25.swarm.chas-lab.dev/docs
    on_stop: stop_review

stop_review:
  stage: cleanup
  script:
    - python delete.py
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  when: manual
  allow_failure: true