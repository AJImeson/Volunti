backend-deploy:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_REF_NAME == "Develop" || $CI_COMMIT_REF_NAME == "main"'
  before_script:
    - apt-get update && apt-get install -y curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
  script:
    - python deploy.py backend
  environment:
    name: production
    url: https://
    on_stop: stop_review

stop_review:
  stage: cleanup
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_REF_NAME == "Develop"|| $CI_COMMIT_REF_NAME == "main"'
      when: manual
  before_script:
    - apt-get update && apt-get install -y curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
  script:
    - python delete.py
  environment:
    name: production
    action: stop
  allow_failure: true
