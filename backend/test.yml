backend-test:
  stage: test-build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: db
      variables:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: $SA_PASSWORD
  variables:
    ConnectionStrings_DefaultConnection: "Server=db;Database=BurgundyDb;User=sa;Password=$SA_PASSWORD;TrustServerCertificate=True"
  script:
    - cd backend/Volunti
    - dotnet restore
    - dotnet test --configuration Release

backend-container-test:
  stage: test-container
  image: docker:latest
  rules:
    - exists:
      - backend/Dockerfile
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    CONTAINER_NAME: test-backend-$CI_JOB_ID
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG
    - docker run -d --name $CONTAINER_NAME -P $IMAGE_TAG
    - HOST_PORT=$(docker port $CONTAINER_NAME 8080/tcp | head -1 | cut -d: -f2)
    - |
      for time in $(seq 1 30); do 
        if curl -s http://localhost:{HOST_PORT}/ >/dev/null 2>&1; then
          echo "Backend responding after: ${time} seconds" 
          docker stop test-container
          exit 0
        fi
        sleep 2
      done
      echo "Backend: Container test failure"
      docker logs $CONTAINER_NAME
      exit 1
  after_script:
    - docker rm -f $CONTAINER_NAME || true
