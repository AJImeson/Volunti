backend-test:
  stage: test-build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: db
      variables:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: $SA_PASSWORD
  variables:
    ConnectionStrings_DefaultConnection: "Server=db;Database=BurgundyDb;User=sa;Password=$SA_PASSWORD;TrustServerCertificate=True"
  script:
    - cd backend/Volunti
    - dotnet restore
    - dotnet test --configuration Release

backend-container-test:
  stage: test-container
  image: docker:latest
  rules:
    - exists:
        - backend/Dockerfile
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    CONTAINER_NAME: test-backend-$CI_JOB_ID
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG
    - docker run -d --name $CONTAINER_NAME $IMAGE_TAG
    - sleep 5
    - docker logs $CONTAINER_NAME
    - docker ps --filter name=$CONTAINER_NAME --filter status=running --format '{.Names}}' | grep $CONTAINER_NAME
  after_script:
    - docker rm -f $CONTAINER_NAME || true
