services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=1GB'
      - '--web.enable-lifecycle'
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - traefik-public
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.${STACK_NAME}-prometheus-https.rule=Host(`prometheus.volunti.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.${STACK_NAME}-prometheus-https.entrypoints=https"
        - "traefik.http.routers.${STACK_NAME}-prometheus-https.tls=true"
        - "traefik.http.routers.${STACK_NAME}-prometheus-https.tls.certresolver=le"
        - "traefik.http.services.${STACK_NAME}-prometheus.loadbalancer.server.port=9090"
    
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.volunti.doe25.swarm.chas-lab.dev
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
      - traefik-public
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.${STACK_NAME}-grafana-https.rule=Host(`grafana.volunti.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.${STACK_NAME}-grafana-https.entrypoints=https"
        - "traefik.http.routers.${STACK_NAME}-grafana-https.tls=true"
        - "traefik.http.routers.${STACK_NAME}-grafana-https.tls.certresolver=le"
        - "traefik.http.services.${STACK_NAME}-grafana.loadbalancer.server.port=3000"

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    deploy:
      mode: global

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    deploy:
      mode: global

configs:
  prometheus_config:
    external: true
    name: ${PROMETHEUS_CONFIG_NAME} 

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: overlay
  traefik-public:
    external: true
