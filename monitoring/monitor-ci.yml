
monitor-check:
  stage: lint
  image: docker:latest
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      changes:
        - monitoring/**/*
        - deploy.py
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      changes:
        - monitoring/**/*
        - deploy.py
  script:
    - cd monitoring
    - docker compose -f monitor-stack.yml config

monitor-deploy:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH ## Automatic deploy on Develop
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    STACK_NAME: volunti-monitoring
    COMPOSE_FILE: monitoring/monitor-stack.yml
    SUBSTITUTE_VARS: "true"
    BACKEND_HOST: api.volunti-burgundy-${CI_COMMIT_REF_SLUG}.doe25.swarm.chas-lab.dev
  before_script:
    - pip install requests
  script:
    - python deploy.py
