frontend-container-build:
  stage: container-build
  image: docker:latest
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "VITE_API_BASE=$FRONTEND_API_BASE" > frontend/Volunti.Web/.env.production
    - cat frontend/Volunti.Web/.env.production
    - docker build -f frontend/Dockerfile -t $IMAGE_TAG -t $CI_REGISTRY_IMAGE/frontend:latest frontend/Volunti.Web
    - docker push $IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
