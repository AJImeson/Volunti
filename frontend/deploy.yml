frontend-deploy:
  stage: deploy
  image: alpine:latest
  needs: ["backend-deploy"]
  script:
    - apk add --no-cache curl
    - sleep 20
    - curl -fk "http://${STACK_NAME}.doe25.swarm.chas-lab.dev" || exit 1
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://$CI_PROJECT_NAMESPACE_SLUG-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG.doe25.swarm.chas-lab.dev
    on_stop: stop_review

stop_review:
  stage: cleanup
  script:
    - python delete.py
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  when: manual
  allow_failure: true