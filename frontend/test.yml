frontend-test:
  stage: test-build
  image: node:20
  script:
    - cd frontend/Volunti.Web
    - npm ci
    - npm run test -- --run

frontend-container-test:
  stage: test-container
  image: docker:latest
  rules:
    - exists:
      - frontend/Dockerfile
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    CONTAINER_NAME: test-frontend-$CI_JOB_ID
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_TAG
    - docker run -d --name $CONTAINER_NAME $IMAGE_TAG
    - sleep 5
    - docker ps --filter name=$CONTAINER_NAME --filter status=running --format '{{.Names}}' | grep $CONTAINER_NAME
    
  after_script:
    - docker rm -f $CONTAINER_NAME || true
