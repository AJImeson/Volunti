# https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: ${PREFIX}mssql-service
  namespace: doe25-group-13
spec:
  clusterIP: None
  selector:
    app: ${PREFIX}mssql-sts
  ports:
  - name: mssql
    protocol: TCP
    port: 1433
    targetPort: 1433
  
---

