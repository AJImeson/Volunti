# Scrape configuration, rules for alerts

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-configuration
  namespace: doe25-group-13
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yaml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'volunti-backend'
        static_configs:
          - targets: ['backend:8080']
        metrics_path: /metrics

  alerts.yaml:
  groups:
    - name: Volunti-
      interval: 20s
      rules:
        - alert: Backend-Down
          expr: up{job="volunti-backend"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Backend service down"
            description: "Backend: Unreachable for 2 minutes"
          


