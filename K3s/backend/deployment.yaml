apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunti-backend
  namespace: doe25-group-13
  labels:
    app: volunti-backend 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volunti-backend
  template:
    metadata:
      labels:
        app: volunti-backend 
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: volunti-backend
          image: registry.chas-lab.dev/chas-challenge-2026/grupp-13/burgundy/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080 
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secret
                  key: MSSQL_SA_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Server=mssql-service,1433;Database=volunti;User Id=sa;Password=$(MSSQL_SA_PASSWORD);TrustServerCertificate=true"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: jwt-key
                  key: Jwt__SigningKey
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

