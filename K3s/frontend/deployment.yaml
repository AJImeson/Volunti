apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunti-frontend
  namespace: doe25-group-13
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volunti-frontend
  template:
    metadata:
      labels:
        app: volunti-frontend
    spec:
      containers:
      - name: volunti-frontend
        image: registry.chas-lab.dev/chas-challenge-2026/grupp-13/burgundy/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80

---
