services:
  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:${IMAGE_TAG}
    environment:
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=Burgundy;User Id=${SA_PASSWORD};TrustServerCertificate=True
      - ASPNETCORE_HTTP_PORTS=8080
    networks:
      - traefik-public
      - internal
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.${STACK_NAME}-backend-https.rule=Host(`api.${STACK_NAME}.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.${STACK_NAME}-backend-https.entrypoints=https"
        - "traefik.http.routers.${STACK_NAME}-backend-https.tls=true"
        - "traefik.http.routers.${STACK_NAME}-backend-https.tls.certresolver=le"
        - "traefik.http.services.${STACK_NAME}-backend.loadbalancer.server.port=8080"

  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:${IMAGE_TAG}
    ports:
      - "3090:80"
    networks:
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.${STACK_NAME}-frontend-https.rule=Host(`${STACK_NAME}.doe25.swarm.chas-lab.dev`)"
        - "traefik.http.routers.${STACK_NAME}-frontend-https.entrypoints=https"
        - "traefik.http.routers.${STACK_NAME}-frontend-https.tls=true"
        - "traefik.http.routers.${STACK_NAME}-frontend-https.tls.certresolver=le"
        - "traefik.http.services.${STACK_NAME}-frontend.loadbalancer.server.port=80"

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
    networks:
      - internal
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata: {}

networks:
  traefik-public:
    external: true
  internal:
